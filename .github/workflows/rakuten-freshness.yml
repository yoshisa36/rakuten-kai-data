name: Rakuten data freshness check


on:
  schedule:
    # 10:30 JST = 01:30 UTC
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rakuten-data-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exported JSON freshness
        run: python scripts/check_rakuten_freshness.py --file rakuten-affiliate.json --max-hours 36
